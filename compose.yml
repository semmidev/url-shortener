name: url-shortener

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: url-shortener-api
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: production
      DB_SOURCE: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-urlshortener}?sslmode=disable
      DB_PGBOUNCER_ENABLED: "true"
      REDIS_ADDRESS: redis:6379
      MIGRATION_URL: file://server/db/migration
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - url_shortener_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        VERSION: ${VERSION:-1.0.0}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: url-shortener-worker
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: production
      DB_SOURCE: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-urlshortener}?sslmode=disable
      DB_PGBOUNCER_ENABLED: "true"
      REDIS_ADDRESS: redis:6379
      WORKER_DB_MAX_CONNS: ${WORKER_DB_MAX_CONNS:-10}
      WORKER_DB_MIN_CONNS: ${WORKER_DB_MIN_CONNS:-2}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - url_shortener_network

  postgres:
    image: postgres:18-alpine
    container_name: url-shortener-postgres
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-urlshortener}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - url_shortener_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: url-shortener-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-urlshortener}
    volumes:
      - ./server/db/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./server/db/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - url_shortener_network

  db-backup:
    image: ghcr.io/solectrus/postgres-s3-backup:18
    container_name: url-shortener-db-backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${DB_NAME:-urlshortener}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-url-shortener-backups}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - url_shortener_network

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - url_shortener_network

  nats:
    image: nats:latest
    container_name: url-shortener-nats
    command: "-js"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - url_shortener_network

volumes:
  postgres_data:

networks:
  url_shortener_network:
    driver: bridge
