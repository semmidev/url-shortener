<!doctype html>
<html lang="en" data-theme="vercel">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem("theme");
          const themes = [
            "neobrutualism", "claude", "supabase", "vercel", "mono",
            "notebook", "light-green", "zen", "astro-vista", "whatsapp"
          ];
          if (saved && themes.includes(saved)) {
            document.documentElement.dataset.theme = saved;
          } else {
            document.documentElement.dataset.theme = "vercel";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Disable browser caching completely to prevent memory/disk cache issues -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Primary SEO -->
    <title>URL Shortener Portal</title>
    <meta name="description" content="Platform belajar online terpadu untuk guru dan siswa. Akses modul, bank soal, ujian, dan pantau perkembangan belajar dengan mudah." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LMS — Platform Belajar Online" />
    <meta property="og:description" content="Platform belajar online terpadu untuk guru dan siswa. Akses modul, bank soal, ujian, dan pantau perkembangan belajar dengan mudah." />
    <meta property="og:url" content="https://lms-staging.spaceku.my.id" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
