<!doctype html>
<html lang="en" data-theme="vercel">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem("theme-preset");
          const themes = [
            "neobrutualism", "claude", "supabase", "vercel", "mono",
            "notebook", "light-green", "zen", "astro-vista", "whatsapp"
          ];
          if (saved && themes.includes(saved)) {
            document.documentElement.dataset.theme = saved;
          } else {
            document.documentElement.dataset.theme = "vercel";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Disable browser caching completely to prevent memory/disk cache issues -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Primary SEO -->
    <title>URL Shortener & Analytics Portal</title>
    <meta name="description" content="Layanan pemendek URL modern, cepat, aman, dan dilengkapi analitik klik real-time serta fitur QR Code." />
    <meta name="keywords" content="URL Shortener, Short Link, Link Analytics, Pemendek URL, QR Code Generator" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="URL Shortener & Analytics Portal" />
    <meta property="og:description" content="Layanan pemendek URL modern, cepat, aman, dan dilengkapi analitik klik real-time serta fitur QR Code." />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-3 focus:bg-background focus:text-foreground">
      Skip to content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
