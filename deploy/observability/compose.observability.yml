name: url-shortener-observability

services:
  alloy:
    image: grafana/alloy:latest
    container_name: url-shortener-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "12345:12345" # Alloy UI & metrics
    restart: unless-stopped
    networks:
      - url_shortener_network

  tempo:
    image: grafana/tempo:latest
    container_name: url-shortener-tempo
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200" # Tempo HTTP
    restart: unless-stopped
    networks:
      - url_shortener_network

  loki:
    image: grafana/loki:latest
    container_name: url-shortener-loki
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100" # Loki HTTP
    restart: unless-stopped
    networks:
      - url_shortener_network

  prometheus:
    image: prom/prometheus:latest
    container_name: url-shortener-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus Web UI
    restart: unless-stopped
    networks:
      - url_shortener_network

  grafana:
    image: grafana/grafana:latest
    container_name: url-shortener-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000" # Grafana UI
    restart: unless-stopped
    networks:
      - url_shortener_network

networks:
  url_shortener_network:
    name: url-shortener_url_shortener_network
    external: true
