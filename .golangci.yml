# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosec
    - gocyclo
    - gocognit
    - misspell
    - unconvert
    - unparam
    - prealloc
    - bodyclose
    - exhaustive
    - nilerr
    - depguard
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*github.com/jackc/pgx/v5.Tx).Rollback
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 60
    gosec:
      excludes:
        - G115
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        no-orm:
          files:
            - "$all"
          deny:
            - pkg: "gorm.io/gorm"
              desc: "no ORM in this project, use pgx/v5 and SQLC directly"
        domain:
          files:
            - "**/internal/*/domain.go"
            - "**/internal/*/dto.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "domain models and DTOs must not import pgx; database calls belong in SQLC store"
            - pkg: "net/http"
              desc: "domain models and DTOs must not import net/http; HTTP handling belongs in http.go"
            - pkg: "github.com/go-chi/chi"
              desc: "domain models and DTOs must not import chi"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - gocognit
        - exhaustive
    - path: server/db/sqlc
      linters:
        - errcheck
        - gosec
        - gocyclo
        - gocognit
    - path: server/docs
      linters:
        - errcheck
        - gosec
        - misspell

